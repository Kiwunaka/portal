<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">POKROV: телефон и компьютер вместе</title>
  <desc id="desc">Мокап кабинета POKROV с Android, Windows и единым управлением устройствами.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f0f8f4"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b4832"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="32" flood-color="#0b4832" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="54" fill="url(#bg)"/>
  <path d="M306 682 C515 382 781 355 1038 575 C1156 675 1271 653 1394 492" fill="none" stroke="#9fe8c4" stroke-width="18" stroke-linecap="round" opacity=".55"/>
  <g filter="url(#shadow)">
    <rect x="190" y="184" width="610" height="470" rx="38" fill="#ffffff" stroke="#d8e6de" stroke-width="2"/>
    <rect x="190" y="184" width="610" height="76" rx="38" fill="#0b4832"/>
    <text x="252" y="338" font-family="Inter, Arial, sans-serif" font-size="38" font-weight="800" fill="#17202f">Мои устройства</text>
    <text x="252" y="386" font-family="Inter, Arial, sans-serif" font-size="23" fill="#697386">Один кабинет для доступа и продления</text>

    <rect x="252" y="440" width="470" height="70" rx="22" fill="#eff8f2" stroke="#cfe0d7"/>
    <circle cx="296" cy="475" r="18" fill="url(#green)"/>
    <text x="334" y="484" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#17202f">Android</text>
    <text x="594" y="484" font-family="Inter, Arial, sans-serif" font-size="20" fill="#0b4832">активен</text>

    <rect x="252" y="536" width="470" height="70" rx="22" fill="#ffffff" stroke="#d8e6de"/>
    <circle cx="296" cy="571" r="18" fill="url(#green)"/>
    <text x="334" y="580" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#17202f">Windows</text>
    <text x="584" y="580" font-family="Inter, Arial, sans-serif" font-size="20" fill="#0b4832">готов</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="886" y="130" width="420" height="680" rx="56" fill="#ffffff" stroke="#d8e6de" stroke-width="2"/>
    <rect x="934" y="190" width="324" height="92" rx="28" fill="#eff8f2"/>
    <text x="974" y="248" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#0b4832">POKROV</text>
    <circle cx="1100" cy="426" r="104" fill="#0b4832"/>
    <circle cx="1100" cy="426" r="74" fill="url(#green)"/>
    <circle cx="1100" cy="426" r="26" fill="#c7f9dc"/>
    <rect x="956" y="574" width="288" height="62" rx="31" fill="url(#green)"/>
    <text x="1016" y="614" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff">Подключить</text>
    <text x="978" y="696" font-family="Inter, Arial, sans-serif" font-size="22" fill="#697386">До 5 личных устройств</text>
  </g>
