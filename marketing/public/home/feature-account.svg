<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">POKROV: один аккаунт и поддержка</title>
  <desc id="desc">Мокап единого аккаунта POKROV с Email, Telegram бонусом и обращениями в поддержку.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eff8f2"/>
    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b4832"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#0b4832" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="54" fill="url(#bg)"/>
  <path d="M420 284 C578 346 640 401 752 450 C642 504 576 570 420 638" fill="none" stroke="#9fe8c4" stroke-width="18" stroke-linecap="round" opacity=".52"/>
  <path d="M1052 450 C1142 450 1204 450 1290 450" fill="none" stroke="#9fe8c4" stroke-width="18" stroke-linecap="round" opacity=".52"/>

  <g filter="url(#shadow)">
    <rect x="204" y="188" width="360" height="170" rx="34" fill="#ffffff" stroke="#d8e6de" stroke-width="2"/>
    <text x="258" y="250" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#17202f">Email-вход</text>
    <rect x="258" y="282" width="236" height="22" rx="11" fill="#d8e6de"/>
    <rect x="258" y="318" width="168" height="18" rx="9" fill="#eef4f0"/>

    <rect x="204" y="542" width="360" height="170" rx="34" fill="#ffffff" stroke="#d8e6de" stroke-width="2"/>
    <text x="258" y="604" font-family="Inter, Arial, sans-serif" font-size="31" font-weight="800" fill="#17202f">Telegram</text>
    <rect x="258" y="636" width="236" height="22" rx="11" fill="#d8e6de"/>
    <text x="258" y="690" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="800" fill="#0b4832">+10 дней</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="690" y="160" width="410" height="610" rx="48" fill="#ffffff" stroke="#d8e6de" stroke-width="2"/>
    <circle cx="895" cy="334" r="82" fill="url(#green)"/>
    <circle cx="895" cy="304" r="28" fill="#c7f9dc"/>
    <path d="M834 381 C852 342 938 342 956 381" fill="#c7f9dc"/>
    <text x="790" y="490" font-family="Inter, Arial, sans-serif" font-size="35" font-weight="800" fill="#17202f">Один аккаунт</text>
    <rect x="780" y="536" width="230" height="22" rx="11" fill="#d8e6de"/>
    <rect x="780" y="584" width="170" height="22" rx="11" fill="#eef4f0"/>
    <rect x="780" y="646" width="230" height="62" rx="31" fill="url(#green)"/>
    <text x="828" y="686" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="800" fill="#ffffff">Кабинет POKROV</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="1224" y="236" width="310" height="412" rx="40" fill="#ffffff" stroke="#d8e6de" stroke-width="2"/>
    <text x="1272" y="306" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="800" fill="#17202f">Поддержка</text>
    <rect x="1272" y="362" width="190" height="58" rx="20" fill="#eff8f2"/>
    <rect x="1298" y="385" width="126" height="14" rx="7" fill="#a9c9ba"/>
    <rect x="1300" y="454" width="150" height="58" rx="20" fill="#0b4832"/>
    <rect x="1326" y="477" width="86" height="14" rx="7" fill="#c7f9dc"/>
    <rect x="1272" y="546" width="214" height="42" rx="21" fill="#eff8f2" stroke="#cfe0d7"/>
    <text x="1304" y="574" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="800" fill="#0b4832">оператор рядом</text>
  </g>
