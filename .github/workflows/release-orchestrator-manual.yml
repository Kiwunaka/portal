name: Release Orchestrator (Manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - verify-only
          - full
      brain_ip:
        description: "Brain public IP"
        required: true
        default: "82.21.114.104"
        type: string
      web_domain:
        description: "Web domain"
        required: true
        default: "pokrov.space"
        type: string
      api_domain:
        description: "API domain"
        required: true
        default: "api.pokrov.space"
        type: string
      quick_gate:
        description: "Use quick gate set"
        required: true
        default: true
        type: boolean
      ensure_metrics_timer:
        description: "Ensure portal-node-metrics.timer before deploy"
        required: true
        default: true
        type: boolean
      release_metadata_file:
        description: "Optional client-owned release-handoff.json path"
        required: false
        default: ""
        type: string
      release_env_file:
        description: "Optional legacy release-links.env path"
        required: false
        default: ""
        type: string

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ops.txt
          pip install -r portal_bot/requirements.txt
          pip install pytest httpx
          cd webapp
          npm ci
          npx playwright install --with-deps chromium

      - name: Run orchestrator
        shell: bash
        env:
          NODE_PASS_BRAIN: ${{ secrets.NODE_PASS_BRAIN }}
          MODE: ${{ inputs.mode }}
          BRAIN_IP: ${{ inputs.brain_ip }}
          WEB_DOMAIN: ${{ inputs.web_domain }}
          API_DOMAIN: ${{ inputs.api_domain }}
          QUICK_GATE: ${{ inputs.quick_gate }}
          ENSURE_METRICS_TIMER: ${{ inputs.ensure_metrics_timer }}
          RELEASE_METADATA_FILE: ${{ inputs.release_metadata_file }}
          RELEASE_ENV_FILE: ${{ inputs.release_env_file }}
        run: |
          set -euo pipefail

          case "$BRAIN_IP" in
            82.21.114.104) ;;
            *)
              echo "::error::brain_ip must match the canonical control-plane host."
              exit 2
              ;;
          esac

          case "$WEB_DOMAIN" in
            pokrov.space) ;;
            *)
              echo "::error::web_domain must match the canonical public host."
              exit 2
              ;;
          esac

          case "$API_DOMAIN" in
            api.pokrov.space) ;;
            *)
              echo "::error::api_domain must match the canonical API host."
              exit 2
              ;;
          esac

          CMD=(python scripts/release_orchestrator.py --brain-ip "$BRAIN_IP" --web-domain "$WEB_DOMAIN" --api-domain "$API_DOMAIN")

          if [[ "$QUICK_GATE" == "true" ]]; then
            CMD+=(--quick-gate)
          fi
          if [[ "$ENSURE_METRICS_TIMER" == "true" ]]; then
            CMD+=(--ensure-metrics-timer)
          fi
          if [[ -n "$RELEASE_METADATA_FILE" ]]; then
            CMD+=(--release-metadata-file "$RELEASE_METADATA_FILE")
          fi
          if [[ -n "$RELEASE_ENV_FILE" ]]; then
            CMD+=(--release-env-file "$RELEASE_ENV_FILE")
          fi

          case "$MODE" in
            dry-run)
              CMD+=(--dry-run)
              ;;
            verify-only)
              CMD+=(--verify-only)
              ;;
            full)
              ;;
            *)
              echo "Unsupported mode: $MODE"
              exit 2
              ;;
          esac

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"
