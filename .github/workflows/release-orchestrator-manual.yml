name: Release Orchestrator (Manual)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        required: true
        default: "dry-run"
        type: choice
        options:
          - dry-run
          - verify-only
          - full
      brain_ip:
        description: "Brain public IP"
        required: true
        default: "82.21.114.104"
        type: string
      web_domain:
        description: "Web domain"
        required: true
        default: "pokrov.space"
        type: string
      api_domain:
        description: "API domain"
        required: true
        default: "api.pokrov.space"
        type: string
      quick_gate:
        description: "Use quick gate set"
        required: true
        default: true
        type: boolean
      ensure_metrics_timer:
        description: "Ensure portal-node-metrics.timer before deploy"
        required: true
        default: true
        type: boolean
      release_metadata_file:
        description: "Strict v2 release-handoff.json path; required for verify-only/full"
        required: false
        default: ""
        type: string
      release_env_file:
        description: "Legacy dry-run input only; rejected for verify-only/full"
        required: false
        default: ""
        type: string

jobs:
  orchestrate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      POKROV_PLATFORM_ROOT: ${{ github.workspace }}/platform
      POKROV_APP_ROOT: ${{ github.workspace }}/POKROV-app
      POKROV_CORE_ROOT: ${{ github.workspace }}/POKROV-core
    steps:
      - name: Checkout platform candidate
        uses: actions/checkout@v4
        with:
          path: platform

      - name: Checkout active client promotion line
        uses: actions/checkout@v4
        with:
          repository: Kiwunaka/POKROV-app
          ref: main
          path: POKROV-app
          ssh-key: ${{ secrets.POKROV_RELEASE_CLIENT_DEPLOY_KEY }}
          lfs: true
          persist-credentials: false

      - name: Checkout Core promotion line
        uses: actions/checkout@v4
        with:
          repository: Kiwunaka/pokrov-core
          ref: main
          path: POKROV-core
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.5"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.14.0"
          cache: "npm"
          cache-dependency-path: platform/webapp/package-lock.json

      - name: Install dependencies
        working-directory: platform
        run: |
          python scripts/check_dependency_contract.py
          python -m pip install pip==26.1.2
          python -m pip install --require-hashes -r requirements-ops.txt
          python -m pip install --require-hashes -r requirements-test.txt
          npm install --global npm@11.7.0
          cd webapp
          npm ci
          npx playwright install --with-deps chromium

      - name: Validate cross-repository release-handoff v2 contract
        working-directory: platform
        run: >-
          python scripts/run_client_release_gate.py contract
          --client-root "${{ github.workspace }}/POKROV-app"
          --core-root "${{ github.workspace }}/POKROV-core"

      - name: Run orchestrator
        shell: bash
        working-directory: platform
        env:
          NODE_PASS_BRAIN: ${{ secrets.NODE_PASS_BRAIN }}
          MODE: ${{ inputs.mode }}
          BRAIN_IP: ${{ inputs.brain_ip }}
          WEB_DOMAIN: ${{ inputs.web_domain }}
          API_DOMAIN: ${{ inputs.api_domain }}
          QUICK_GATE: ${{ inputs.quick_gate }}
          ENSURE_METRICS_TIMER: ${{ inputs.ensure_metrics_timer }}
          RELEASE_METADATA_FILE: ${{ inputs.release_metadata_file }}
          RELEASE_ENV_FILE: ${{ inputs.release_env_file }}
        run: |
          set -euo pipefail

          if [[ "$MODE" != "dry-run" && -z "$RELEASE_METADATA_FILE" ]]; then
            echo "::error::release_metadata_file is required for verify-only and full execution."
            exit 2
          fi
          if [[ "$MODE" != "dry-run" && -n "$RELEASE_ENV_FILE" ]]; then
            echo "::error::release_env_file is legacy-only and cannot be used for remote execution."
            exit 2
          fi

          case "$BRAIN_IP" in
            82.21.114.104) ;;
            *)
              echo "::error::brain_ip must match the canonical control-plane host."
              exit 2
              ;;
          esac

          case "$WEB_DOMAIN" in
            pokrov.space) ;;
            *)
              echo "::error::web_domain must match the canonical public host."
              exit 2
              ;;
          esac

          case "$API_DOMAIN" in
            api.pokrov.space) ;;
            *)
              echo "::error::api_domain must match the canonical API host."
              exit 2
              ;;
          esac

          CMD=(python scripts/release_orchestrator.py --brain-ip "$BRAIN_IP" --web-domain "$WEB_DOMAIN" --api-domain "$API_DOMAIN")

          if [[ "$QUICK_GATE" == "true" ]]; then
            CMD+=(--quick-gate)
          fi
          if [[ "$ENSURE_METRICS_TIMER" == "true" ]]; then
            CMD+=(--ensure-metrics-timer)
          fi
          if [[ -n "$RELEASE_METADATA_FILE" ]]; then
            CMD+=(--release-metadata-file "$RELEASE_METADATA_FILE")
          fi
          if [[ -n "$RELEASE_ENV_FILE" ]]; then
            CMD+=(--release-env-file "$RELEASE_ENV_FILE")
          fi

          case "$MODE" in
            dry-run)
              CMD+=(--dry-run)
              ;;
            verify-only)
              CMD+=(--verify-only)
              ;;
            full)
              ;;
            *)
              echo "Unsupported mode: $MODE"
              exit 2
              ;;
          esac

          echo "Running: ${CMD[*]}"
          "${CMD[@]}"
