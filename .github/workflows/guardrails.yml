name: Guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  repo-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            webapp/package-lock.json
            marketing/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ops.txt
          pip install -r portal_bot/requirements.txt

      - name: Install frontend dependencies
        run: |
          npm ci --prefix marketing
          npm ci --prefix webapp

      - name: Validate script manifest references
        run: python scripts/check_script_manifest.py

      - name: Validate generated artifacts and public wording
        run: python scripts/ci_check_artifacts.py --check-copy

      - name: Validate shared-facts and release-handoff contracts
        run: python -m unittest tests.test_shared_surface_facts tests.test_remote_brain_apply_release_handoff tests.test_release_orchestrator tests.test_smoke_client_apps

      - name: CI release guardrails
        run: python scripts/release_gate_check.py --quick --ci-guardrails
