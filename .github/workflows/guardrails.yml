name: Guardrails

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  repo-guardrails:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate script manifest references
        run: python scripts/check_script_manifest.py

      - name: Validate generated artifacts and public wording
        run: python scripts/ci_check_artifacts.py --check-copy
