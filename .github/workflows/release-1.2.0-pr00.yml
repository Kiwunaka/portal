name: Release 1.2.0 PR-00 Freeze

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-base-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Fetch exact promotion base
        run: git fetch --no-tags origin master:refs/remotes/origin/master

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validate release-base isolated freeze
        env:
          POKROV_RELEASE_HEAD_REF: ${{ github.head_ref || github.ref_name }}
        run: python -B scripts/validate_release_1_2_pr00.py --base-ref origin/master

      - name: Run focused tests
        run: >-
          python -B -m unittest discover
          -s tests
          -p test_release_1_2_pr00.py
          -v
