# Brain L4 router (TCP passthrough on :443)
# Direct-node mode:
# - brain serves only website/API/payment hosts
# - node subdomains must resolve directly to worker IPs in DNS
# - no worker traffic relaying on brain

global
  log /dev/log local0
  maxconn 4096

defaults
  log global
  mode tcp
  timeout connect 10s
  timeout client 1m
  timeout server 1m

frontend fe_tls_443
  bind :443
  stick-table type ip size 200k expire 10m store conn_cur,conn_rate(10s)
  tcp-request connection track-sc0 src
  tcp-request connection reject if { sc_conn_cur(0) gt 120 }
  tcp-request connection reject if { sc_conn_rate(0) gt 80 }
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }

  # Public hosts served on brain.
  use_backend be_site if { req.ssl_sni -i pokrov.space }
  use_backend be_site if { req.ssl_sni -i www.pokrov.space }
  use_backend be_site if { req.ssl_sni -i app.pokrov.space }
  use_backend be_site if { req.ssl_sni -i connect.pokrov.space }
  use_backend be_site if { req.ssl_sni -i api.pokrov.space }
  use_backend be_site if { req.ssl_sni -i pay.pokrov.space }
  use_backend be_site if { req.ssl_sni -i portal-privacy.online }
  use_backend be_site if { req.ssl_sni -i www.portal-privacy.online }
  use_backend be_site if { req.ssl_sni -i connect.portal-privacy.online }
  use_backend be_site if { req.ssl_sni -i kiwunaka.space }
  use_backend be_site if { req.ssl_sni -i www.kiwunaka.space }
  use_backend be_site if { req.ssl_sni -i pay.kiwunaka.space }
  default_backend be_site

backend be_site
  mode tcp
  server caddy_8444 127.0.0.1:8444 check
