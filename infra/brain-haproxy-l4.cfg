# Brain L4 router (TCP passthrough on :443)
# Production mapping (domain split):
# - portal-privacy.online -> local Caddy :8444 (marketing + /webapp)
# - kiwunaka.space -> local Caddy :8444 (/api, /pay, /s8...)
# - pl/nl/free/us -> workers
# - it backend exists but DNS can stay direct until phase B

global
  log /dev/log local0
  maxconn 4096

defaults
  log global
  mode tcp
  timeout connect 10s
  timeout client 1m
  timeout server 1m

frontend fe_tls_443
  bind :443
  tcp-request inspect-delay 5s
  tcp-request content accept if { req.ssl_hello_type 1 }

  # Reality clients present camouflage SNI (e.g. www.orange.pl),
  # not node hostnames. Route by those SNI values first.
  use_backend be_pl if { req.ssl_sni -i www.orange.pl }
  use_backend be_it if { req.ssl_sni -i www.tim.it }
  use_backend be_nl if { req.ssl_sni -i www.kpn.com }
  use_backend be_free if { req.ssl_sni -i www.ziggo.nl }
  use_backend be_us if { req.ssl_sni -i www.microsoft.com }

  # Hostname-based fallback routing (for non-Reality probes/debug).
  use_backend be_site if { req.ssl_sni -i portal-privacy.online }
  use_backend be_site if { req.ssl_sni -i www.portal-privacy.online }
  use_backend be_site if { req.ssl_sni -i kiwunaka.space }
  use_backend be_site if { req.ssl_sni -i www.kiwunaka.space }
  use_backend be_site if { req.ssl_sni -i pay.kiwunaka.space }
  use_backend be_pl if { req.ssl_sni -i pl.kiwunaka.space }
  use_backend be_nl if { req.ssl_sni -i nl.kiwunaka.space }
  use_backend be_free if { req.ssl_sni -i free.kiwunaka.space }
  use_backend be_us if { req.ssl_sni -i us.kiwunaka.space }
  use_backend be_it if { req.ssl_sni -i it.kiwunaka.space }
  default_backend be_site

backend be_site
  mode tcp
  server caddy_8444 127.0.0.1:8444 check

backend be_pl
  mode tcp
  server pl_node 82.40.38.84:443 check

backend be_nl
  mode tcp
  server nl_premium 82.24.195.93:443 check

backend be_free
  mode tcp
  server free_node 151.245.217.23:443 check

backend be_us
  mode tcp
  server us_node 82.21.92.142:443 check

backend be_it
  mode tcp
  server it_node 151.241.215.84:443 check
