global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend fe_transport_front
    bind :443
    mode tcp
    stick-table type ip size 200k expire 10m store conn_cur,conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc_conn_cur(0) gt 160 }
    tcp-request connection reject if { sc_conn_rate(0) gt 100 }
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    default_backend be_legacy_reality_fallback

backend be_legacy_reality_fallback
    mode tcp
    option tcp-check
    server legacy_reality_fallback 127.0.0.1:10443 check
