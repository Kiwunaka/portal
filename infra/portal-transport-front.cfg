global
    log stdout format raw local0
    maxconn 4096

defaults
    log global
    mode tcp
    timeout connect 5s
    timeout client 60s
    timeout server 60s

frontend fe_transport_front
    bind :443
    mode tcp
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend be_legacy_reality_fallback if { req.ssl_sni -i connect.pokrov.space }
    use_backend be_grpc_443_primary if { req.ssl_sni -i grpc.connect.pokrov.space }
    use_backend be_grpc_443_primary if { req.ssl_sni -i mux.connect.pokrov.space }
    default_backend be_legacy_reality_fallback

backend be_legacy_reality_fallback
    mode tcp
    option tcp-check
    server legacy_reality_fallback 127.0.0.1:10443 check

backend be_grpc_443_primary
    mode tcp
    option tcp-check
    server grpc_443_primary 127.0.0.1:11443 check
