# Install only after the identity, storage permissions and rollback rehearsal
# in deployment-and-access.md. The empty dotenv mount contains no credentials.
[Service]
User=pokrov-api
Group=pokrov-api
EnvironmentFile=
EnvironmentFile=/root/portal_bot/.env
EnvironmentFile=/root/portal_bot/support-case.env
EnvironmentFile=/etc/pokrov/support-api.env
Environment=PYTHONDONTWRITEBYTECODE=1
NoNewPrivileges=yes
CapabilityBoundingSet=
ProtectProc=invisible
PrivateTmp=yes
TemporaryFileSystem=/root:ro,mode=0755
BindReadOnlyPaths=/root/portal_bot /root/shared /root/copy
BindReadOnlyPaths=/etc/pokrov/api-empty.env:/root/portal_bot/.env
BindPaths=/root/portal_bot/uploads/support /root/portal_bot/uploads/promos
