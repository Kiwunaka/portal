    <text x="712" y="425" font-family="Inter, Arial, sans-serif" font-size="25" font-weight="800" fill="#17202f">5 дней</text>
    <text x="816" y="425" font-family="Inter, Arial, sans-serif" font-size="19" fill="#697386">без карты</text>

