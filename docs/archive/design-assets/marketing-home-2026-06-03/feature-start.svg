    <circle cx="284" cy="161" r="10" fill="#c7f9dc"/>
    <circle cx="320" cy="161" r="10" fill="#7dd3a6"/>
    <circle cx="356" cy="161" r="10" fill="#ffffff" opacity=".55"/>

