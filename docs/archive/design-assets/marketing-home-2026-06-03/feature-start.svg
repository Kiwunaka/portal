    <circle cx="461" cy="516" r="98" fill="#0b4832"/>
    <circle cx="461" cy="516" r="70" fill="url(#green)"/>
    <circle cx="461" cy="516" r="30" fill="#c7f9dc"/>
    <text x="365" y="668" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="800" fill="#0b4832">Подключить</text>

