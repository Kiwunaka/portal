    </linearGradient>
    <linearGradient id="green" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0b4832"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#0b4832" flood-opacity=".16"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="54" fill="url(#bg)"/>
  <circle cx="260" cy="170" r="170" fill="#d6f7e7" opacity=".55"/>
  <circle cx="1260" cy="720" r="250" fill="#d7f3e4" opacity=".6"/>

