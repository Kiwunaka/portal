<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">POKROV: старт в приложении</title>
  <desc id="desc">Мокап приложения POKROV с кнопкой подключения, тестовым периодом и проверкой сервисов.</desc>
  <defs>
