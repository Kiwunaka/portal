<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700;800&display=swap');
  * { margin: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px; overflow: hidden;
    font-family: 'Golos Text', 'Segoe UI', sans-serif;
    background: #ffffff; color: #16181d;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 80px 64px;
    position: relative;
  }
  .glow {
    position: absolute; right: -220px; top: -220px; width: 640px; height: 640px;
    border-radius: 50%; background: radial-gradient(circle, #e6f4ed 0%, rgba(230,244,237,0) 70%);
  }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 64px; height: 64px; }
  .brand span { font-size: 34px; font-weight: 800; letter-spacing: 0.01em; }
  h1 {
    font-size: 76px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.08;
    max-width: 980px; position: relative;
  }
  .facts { display: flex; align-items: center; gap: 14px; position: relative; }
  .chip {
    display: inline-flex; align-items: center; gap: 10px;
    border-radius: 999px; padding: 14px 26px; font-size: 26px; font-weight: 600;
  }
  .chip--primary { background: #12805a; color: #ffffff; }
  .chip--soft { background: #e6f4ed; color: #0f6b47; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #34c759; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="brand">
    <img src="pokrov-logo.svg" alt="">
    <span>POKROV</span>
  </div>
  <h1>YouTube снова летает.<br>И всё остальное тоже.</h1>
  <div class="facts">
    <span class="chip chip--primary">5 дней бесплатно</span>
    <span class="chip chip--soft"><span class="dot"></span>карта не нужна</span>
    <span class="chip chip--soft">Android + Windows</span>
  </div>
</body>
</html>
